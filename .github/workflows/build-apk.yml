name: Build MOIRE Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/*.txt']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
      - name: Install packages
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app
        run: npx cap sync android
      - name: Install native widgets and notification
        run: bash native/install-native.sh
      - name: Apply official MOIRE launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp android-icons/mipmap-$density/ic_launcher.png android/app/src/main/res/mipmap-$density/ic_launcher.png
            cp android-icons/mipmap-$density/ic_launcher_round.png android/app/src/main/res/mipmap-$density/ic_launcher_round.png
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Configure signed release
        env:
          KEYSTORE_B64: ${{ secrets.MOIRE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MOIRE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOIRE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOIRE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/moire-release.jks
          python3 native/configure-signing.py
      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.MOIRE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOIRE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOIRE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MOIRE-signed-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
